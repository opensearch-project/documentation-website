name: Lint and Test Jekyll Spec Insert
on:
  push:
    paths:
      - 'spec-insert/**'
  pull_request:
    paths:
      - 'spec-insert/**'
jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ruby/setup-ruby@f9c4492e86def3e644ab32a0ef185eda5b0c20d0 # v1.342.0
        with:
          ruby-version: '3.4.13'
      - run: bundle install
      - working-directory: spec-insert
        run: |
          bundle exec rubocop
          bundle exec rspec
